<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#14532d" />
  <meta name="robots" content="noindex" />
  <title>You're offline | Choose Your Therapist</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; color: #0b1712; background: radial-gradient(circle at 100% 0, #fdf3dc 0, transparent 40%), #f4f8f5; }
    .box { width: 100%; max-width: 400px; background: #fff; border: 1px solid #e2ebe5; border-radius: 22px; padding: 30px 24px; text-align: center; box-shadow: 0 18px 40px -28px rgba(20,83,45,.6); }
    img { width: 72px; height: 72px; }
    h1 { font-size: 22px; margin: 14px 0 8px; }
    p { margin: 0 0 18px; color: #5b6b63; font-size: 15px; line-height: 1.6; }
    button { width: 100%; height: 48px; border: 0; border-radius: 12px; font-size: 15.5px; font-weight: 800; color: #fff; background: linear-gradient(180deg, #1f7a4a, #14532d); cursor: pointer; }
    .help { margin-top: 18px; padding-top: 16px; border-top: 1px solid #e2ebe5; font-size: 13.5px; color: #5b6b63; line-height: 1.7; }
    .help a { color: #b42318; font-weight: 800; text-decoration: none; }
  </style>
</head>
<body>
  <main class="box">
    <img src="/icons/cyt-icon-192.png" alt="Choose Your Therapist" />
    <h1>You're offline</h1>
    <p>Check your internet connection. Your sessions and messages are safe — they'll be here when you're back online.</p>
    <button type="button" onclick="location.reload()">Try again</button>
    <div class="help">Need to talk to someone right now?<br />Call <a href="tel:14416">Tele-MANAS 14416</a> (free, 24x7) or <a href="tel:112">112</a>.</div>
  </main>
  <script>window.addEventListener('online', function () { location.reload(); });</script>
</body>
</html>
